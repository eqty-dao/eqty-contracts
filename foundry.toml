[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
test = "test/foundry"

# Solidity version
solc_version = "0.8.28"

# Optimizer
optimizer = true
optimizer_runs = 200

# Compatibility with Hardhat's OpenZeppelin (installed via npm)
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/"
]

# Format
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

# Gas reports
[profile.default.fuzz]
runs = 256
