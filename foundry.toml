[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
test = "test"

# Solidity version
solc_version = "0.8.28"

# Optimizer (high runs for frequently-called contracts)
optimizer = true
optimizer_runs = 200
via_ir = true

# Remappings for OpenZeppelin and forge-std
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Formatting
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

# Fuzz testing
[profile.default.fuzz]
runs = 256

